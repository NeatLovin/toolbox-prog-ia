name = "toolbox-prog-ia-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Purge quotidienne des données au-delà de la rétention annoncée (voir index.js: scheduled()).
[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "toolbox-telemetry"
database_id = "d971299e-becb-4605-ac50-313aba36dfba"

# Valeurs non secrètes. ANTHROPIC_API_KEY se configure séparément avec :
#   wrangler secret put ANTHROPIC_API_KEY
[vars]
# localhost:5173 = vite dev ; localhost:4173 = vite preview (build --mode development, utilisé
# par worker/scripts/verify-e2e.mjs pour la vérification bout en bout du lot 7).
ALLOWED_ORIGINS = "https://neatlovin.github.io,http://localhost:5173,http://localhost:4173"
AUDIT_KILL_SWITCH = "false"
AUDIT_MAX_CHARS = "160000"
AUDIT_RATE_LIMIT_PER_SESSION_HOUR = "5"
# Valeur de lancement (22 enseignants pouvant tous essayer le même jour) : voir
# worker/README.md section "Coût maximal théorique" pour le calcul mesuré. À redescendre à
# 40-50 après la semaine de lancement (redéploiement manuel requis, pas automatique).
AUDIT_DAILY_GLOBAL_CAP = "120"
# Date au-delà de laquelle le Worker signale (journaux + `npm run preflight`, jamais une
# modification automatique) que le plafond de lancement ci-dessus mérite d'être reconsidéré.
# Repoussée à 14 jours après l'envoi réel du lien aux 22 enseignants (2026-09-23, confirmé) : la
# valeur précédente (2026-10-06) avait été calculée sur un envoi prévu le 2026-09-22, qui n'a
# finalement pas eu lieu à cette date.
AUDIT_DAILY_CAP_REVIEW_DATE = "2026-10-07"
RETENTION_DAYS = "365"
